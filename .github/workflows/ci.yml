name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests (core suite, no heavy AI/GUI deps)
        env:
          MPLBACKEND: Agg
        run: |
          pytest -p no:cacheprovider -o addopts="" \
            tests/test_base.py tests/test_audio_io.py tests/test_analysis.py \
            tests/test_metadata.py tests/test_synthesis.py tests/test_tts.py \
            tests/test_algorithm_manager.py tests/test_similarity_algorithms.py \
            tests/test_segment_matcher.py tests/test_batch.py
